
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050805"></stop>
      <stop offset="50%" stop-color="#102719"></stop>
      <stop offset="100%" stop-color="#030603"></stop>
    </linearGradient>
    <linearGradient id="green">
      <stop offset="0%" stop-color="#166534"></stop>
      <stop offset="50%" stop-color="#4ADE80"></stop>
      <stop offset="100%" stop-color="#BBF7D0"></stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#bg)"></rect>

  <g stroke="#4ADE80" stroke-opacity=".13">
    <path d="M100 0V300 M200 0V300 M300 0V300 M900 0V300 M1000 0V300 M1100 0V300"></path>
  </g>

  <g fill="#4ADE80">
    <circle cx="100" cy="30" r="4">
      <animate attributeName="cy" values="30;260;30" dur="4s" repeatCount="indefinite"></animate>
    </circle>
    <circle cx="250" cy="200" r="3">
      <animate attributeName="cy" values="200;20;200" dur="5s" repeatCount="indefinite"></animate>
    </circle>
    <circle cx="1000" cy="60" r="4">
      <animate attributeName="cy" values="60;260;60" dur="4s" repeatCount="indefinite"></animate>
    </circle>
    <circle cx="1100" cy="240" r="3">
      <animate attributeName="cy" values="240;30;240" dur="6s" repeatCount="indefinite"></animate>
    </circle>
  </g>

  <rect x="15" y="15" width="1170" height="270" rx="16" fill="none" stroke="#4ADE80" stroke-width="2">
    <animate attributeName="stroke-opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"></animate>
  </rect>

  <text x="600" y="75" text-anchor="middle" fill="#4ADE80" font-size="17" letter-spacing="7" font-family="monospace">
    WELCOME TO MY DEVELOPER WORLD
  </text>

  <text x="600" y="155" text-anchor="middle" fill="url(#green)" font-size="76" font-weight="bold" font-family="monospace" filter="url(#glow)">
    MUHAMMAD EBAD
    <animate attributeName="opacity" values=".75;1;.75" dur="2.5s" repeatCount="indefinite"></animate>
  </text>

  <path d="M270 180 H930" stroke="#4ADE80" stroke-width="2">
    <animate attributeName="stroke-dasharray" values="0 660;660 0;0 660" dur="5s" repeatCount="indefinite"></animate>
  </path>

  <text x="600" y="220" text-anchor="middle" fill="#FFFFFF" font-size="23" letter-spacing="2" font-family="monospace">
    ASPIRING FULL STACK DEVELOPER
  </text>

  <text x="600" y="260" text-anchor="middle" fill="#4ADE80" font-size="15" letter-spacing="5" font-family="monospace">
    LEARN • BUILD • INNOVATE
  </text>
</svg>
